spring.application.name=Stokio

# ==============================================
# BANCO DE DADOS
# Localmente usa H2 em memória; em produção no Render aceita PostgreSQL via SPRING_DATASOURCE_URL
# ==============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:stokio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (disponível localmente)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- HikariCP ---
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# --- Swagger / SpringDoc ---
springdoc.swagger-ui.path=/projeto-integrador/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
