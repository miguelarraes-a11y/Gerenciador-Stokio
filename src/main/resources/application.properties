spring.application.name=Stokio

# ==============================================
# BANCO DE DADOS LOCAL (H2 em memoria)
# Sem necessidade de instalar nada - roda na RAM
# ==============================================
spring.datasource.url=jdbc:h2:mem:stokio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

